:root {
  --c1: #ffd7a8;
  --c2: #ffb199;
  --c3: #ff8fab;
  --accent: #d9480f;
  --ink: #1b2a3a;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--c2);
  -webkit-text-size-adjust: 100%;
}
.stage {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  overflow: hidden;
  background: linear-gradient(160deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
}
.sun {
  position: absolute;
  top: -120px;
  right: -100px;
  width: 420px;
  max-width: 90vw;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.75) 32%, rgba(255,255,255,0) 68%);
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(36px);
  opacity: .5;
}
.blob.one { width: 260px; height: 260px; left: -90px; bottom: 12%; background: var(--c3); }
.blob.two { width: 220px; height: 220px; right: -60px; bottom: -60px; background: var(--c1); }
.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.date {
  align-self: flex-start;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,.6);
}
.card {
  position: relative;
  padding: 34px 28px 26px;
  border-radius: 32px;
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 34px 60px -28px rgba(20,30,60,.4), inset 0 2px 0 rgba(255,255,255,.8);
}
.says {
  margin: 0;
  display: inline-block;
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: 3.2rem;
  line-height: 1;
  color: var(--accent);
  transform: rotate(-2deg);
  transform-origin: left center;
}
.says svg { display: block; width: 100%; height: 12px; margin-top: 2px; }
h1 {
  margin: 20px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.65rem, 6.4vw, 2.5rem);
  line-height: 1.16;
  letter-spacing: -.015em;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.sign {
  margin: 24px 0 0;
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: 1.9rem;
  line-height: 1.1;
  color: var(--accent);
}
.actions {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px dashed rgba(27,42,58,.22);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
button {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: .95rem;
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  cursor: pointer;
  box-shadow: 0 10px 20px -10px var(--accent);
}
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.status { font-size: .88rem; min-height: 1.2em; opacity: .75; }
.foot { text-align: center; font-size: .9rem; font-weight: 600; opacity: .8; }
.star {
  position: absolute;
  top: 22px;
  right: 24px;
  width: 38px;
  height: 38px;
  color: var(--accent);
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .date, .foot { animation: fade 1s .3s ease-out both; }
  .blob.one { animation: drift 14s ease-in-out infinite alternate; }
  .blob.two { animation: drift 18s ease-in-out infinite alternate-reverse; }
  .star { animation: twinkle 3.2s ease-in-out infinite; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: inherit; } }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px,-26px); } }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.2) rotate(18deg); } }
}
</style>
</head>
<body>
<main class="stage">
  <div class="sun" aria-hidden="true"></div>
  <div class="blob one" aria-hidden="true"></div>
  <div class="blob two" aria-hidden="true"></div>
  <div class="wrap">
    <div class="date" id="date">Today</div>
    <section class="card">
      <svg class="star" viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" d="M20 0c1.5 11 8.9 18.5 20 20-11.100 1.500-18.500 9-20 20-1.500-11-8.900-18.500-20-20C11.100 18.500 18.500 11 20 0z"/></svg>
      <p class="says">Ali says
        <svg viewBox="0 0 160 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8c24-8 50 4 76-2s52-3 80-2" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>

      <h1 id="msg">Today is a good day to start something small and finish it well.</h1>
      <p class="sign">Your day is going to be fine. &mdash; Ali</p>
      <div class="actions">
        <button type="button" id="share">Share with a friend</button>
        <span class="status" id="status" role="status"></span>

    </section>
    <div class="foot">A new message arrives every day. See you tomorrow.</div>
  </div>
</main>

<script>
var MESSAGES = [

var PALETTES = [
  { c1: "#ffd7a8", c2: "#ffb199", c3: "#ff8fab", accent: "#d9480f" }, /* sunrise */
  { c1: "#b8f1ff", c2: "#7cc7ff", c3: "#7f9cff", accent: "#1864ab" }, /* ocean */
  { c1: "#e4d4ff", c2: "#c4b5fd", c3: "#f0abfc", accent: "#7048e8" }, /* lavender */
  { c1: "#c8f7dc", c2: "#8de0c0", c3: "#6bc5e8", accent: "#087f5b" }, /* mint */
  { c1: "#ffd1d1", c2: "#ffa8a8", c3: "#ffc078", accent: "#c92a2a" }, /* coral */
  { c1: "#fff3a8", c2: "#ffd966", c3: "#ffb870", accent: "#a85400" }, /* lemon */
  { c1: "#ffd6e8", c2: "#c9b8ff", c3: "#9ec5ff", accent: "#5f3dc4" }  /* dusk */
];

(function () {
  var N = MESSAGES.length;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function orderFor(cycle) {
    var idx = [], i, j, k, tmp;
    for (i = 0; i < N; i++) idx.push(i);
    var rnd = mulberry32(1000 + cycle * 7919);
    for (j = N - 1; j > 0; j--) {
      k = Math.floor(rnd() * (j + 1));
      tmp = idx[j]; idx[j] = idx[k]; idx[k] = tmp;
    }
    return idx;
  }

  var now = new Date();
  var dayNumber = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  var text = MESSAGES[orderFor(Math.floor(dayNumber / N))[dayNumber % N]];
  document.getElementById("msg").textContent = text;

  var p = PALETTES[dayNumber % PALETTES.length];
  var root = document.documentElement.style;
  root.setProperty("--c1", p.c1);
  root.setProperty("--c2", p.c2);
  root.setProperty("--c3", p.c3);
  root.setProperty("--accent", p.accent);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", p.c2);

  try {
    document.getElementById("date").textContent =
      now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  } catch (e) {}

  var status = document.getElementById("status");
  document.getElementById("share").addEventListener("click", function () {
    var line = text + " (Ali says your day will be fine)";
    function copy() {
      try {
        navigator.clipboard.writeText(line + " " + location.href).then(
          function () { status.textContent = "Copied. Send it along."; },
          function () { status.textContent = "Could not copy. Select the text instead."; });
      } catch (e) { status.textContent = "Could not copy. Select the text instead."; }
    }
    if (navigator.share) {
      navigator.share({ title: "Ali says your day will be fine", text: line, url: location.href }).catch(function () {});
    } else { copy(); }
  });
})();
</script>
